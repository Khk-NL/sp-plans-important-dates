name: Release plugin ZIP

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package flat Super Productivity plugin
        shell: pwsh
        run: Compress-Archive -Path manifest.json,index.html,icon.svg,i18n -DestinationPath sp-plans-important-dates.zip
      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" sp-plans-important-dates.zip --generate-notes
